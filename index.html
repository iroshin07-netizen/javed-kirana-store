<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Javed Kirana Store</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-content">
            <img src="logo.png?v=2" alt="Logo" class="splash-logo">
            <h2>Javed Kirana Store</h2>
            <p>Fresh & Fast Delivery</p>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="brand-box">
            <img src="logo.png?v=2" alt="Logo" class="store-logo-img">
            <div>
                <h1 class="logo">Javed Kirana Store</h1>
                <p class="delivery-sub">Fresh Delivery • Lucknow</p>
            </div>
        </div>
        <div class="cart-box" id="cart-button">
            🛒 Cart <span id="cart-count" class="badge">0</span>
        </div>
    </header>

    <div id="announcement-bar" class="announcement-banner hidden">
        📢 <span id="announcement-text"></span>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs-container">
        <div class="category-scroll">
            <button class="cat-tab active" onclick="filterByCategory('All')">All Items</button>
            <button class="cat-tab" onclick="filterByCategory('Groceries')">Groceries</button>
            <button class="cat-tab" onclick="filterByCategory('Snacks')">Snacks</button>
        </div>
    </div>

    <!-- Main Container -->
    <main class="container">
        <div id="product-container" class="product-grid">
            <p class="loading-text">Loading fresh items...</p>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="floating-cart" class="floating-cart hidden">
        <div class="fc-left"><span id="fc-count">0 items</span> • <span id="fc-total">₹0</span></div>
        <div class="fc-right">View Cart 🛒</div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Basket</h2>
                <button id="close-cart" class="close-btn">✖</button>
            </div>
            <div id="cart-items" class="cart-items-container"></div>
            <div class="cart-total">
                <h3>Total: <span id="cart-total-price">₹0</span></h3>
            </div>
            <div class="checkout-form">
                <input type="text" id="cust-name" placeholder="Your Name" class="input-field">
                <input type="tel" id="cust-phone" placeholder="WhatsApp Number" class="input-field">
                <textarea id="cust-address" placeholder="Full Delivery Address (Or Write 'Store Pickup')" class="input-field"></textarea>
                
                <!-- Payment & Fulfillment Options -->
                <label class="section-label">Select Option:</label>
                <div class="payment-options">
                    <label class="radio-card">
                        <input type="radio" name="pay-method" value="Cash on Delivery" checked onchange="toggleUpiSection()">
                        <span>💵 Cash on Delivery</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="pay-method" value="Store Pickup" onchange="toggleUpiSection()">
                        <span>🏪 Pickup at Store</span>
                    </label>
                    <label class="radio-card">
                        <input type="radio" name="pay-method" value="Pay via UPI" onchange="toggleUpiSection()">
                        <span>⚡ Pay via UPI (QR Code)</span>
                    </label>
                </div>

                <!-- UPI QR Code & Screenshot Upload Section -->
                <div id="upi-section" class="upi-box hidden">
                    <p class="upi-instruction">Scan QR Code to Pay via UPI:</p>
                    <img src="https://i.postimg.cc/kXQnRXkW/IMG-20260822-WA0000(1).jpg" alt="Javed Kirana Store QR" class="qr-code-img">
                    
                    <div class="upi-id-container">
                        <span class="upi-id-text">UPI ID: <b id="display-upi-id">9335587946@ptyes</b></span>
                        <button type="button" id="copy-upi-btn" class="copy-btn" onclick="copyUpiId()">Copy</button>
                    </div>

                    <p class="qr-note">After payment, upload your payment screenshot below:</p>
                    
                    <label class="file-upload-label">
                        📁 Upload Payment Screenshot:
                        <input type="file" id="payment-screenshot" accept="image/*" class="file-input">
                    </label>
                </div>

                <button id="place-order-btn" class="place-order-btn">Place Order</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
