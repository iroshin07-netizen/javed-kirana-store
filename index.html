<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javed Kirana Store</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Splash Screen Animation -->
    <div id="splash-screen">
        <img src="logo.png" alt="Logo" class="logo-animation">
        <p>Javed Kirana Store</p>
    </div>

    <header class="header">
        <div class="brand-box">
            <img src="logo.png" alt="Logo" class="store-logo-img">
            <div>
                <h1 class="logo">Javed Kirana Store</h1>
                <p class="delivery-sub">Fresh Delivery • Lucknow</p>
            </div>
        </div>
        <div class="cart-box" id="cart-button">🛒 Cart <span id="cart-count" class="badge">0</span></div>
    </header>

    <div id="announcement-bar" class="announcement-banner hidden">📢 <span id="announcement-text"></span></div>

    <div class="category-tabs-container">
        <div class="category-scroll">
            <button class="cat-tab active" onclick="filterByCategory('All')">All Items</button>
            <button class="cat-tab" onclick="filterByCategory('Groceries')">Groceries</button>
            <button class="cat-tab" onclick="filterByCategory('Snacks')">Snacks</button>
        </div>
    </div>

    <main class="container">
        <div id="product-container" class="product-grid"></div>
    </main>

    <div id="floating-cart" class="floating-cart hidden">
        <div class="fc-left"><span id="fc-count">0 items</span> • <span id="fc-total">₹0</span></div>
        <div class="fc-right">View Cart</div>
    </div>

    <div id="cart-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header"><h2>Your Basket</h2><button id="close-cart" class="close-btn">✖</button></div>
            <div id="cart-items" class="cart-items-container"></div>
            <div class="cart-total"><h3>Total: <span id="cart-total-price">₹0</span></h3></div>
            <input type="text" id="cust-name" placeholder="Name" class="input-field">
            <input type="tel" id="cust-phone" placeholder="WhatsApp Number" class="input-field">
            <textarea id="cust-address" placeholder="Full Address" class="input-field"></textarea>
            <button id="place-order-btn" class="place-order-btn">Place Order</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
